name: Auto-merge PRs

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to auto-merge (leave blank to process all open PRs)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Run for Jules bot PRs automatically, or manually via workflow_dispatch
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       (contains(fromJSON('["google-labs-jules[bot]", "github-actions[bot]"]'), github.event.pull_request.user.login) ||
        contains(github.event.pull_request.body, 'PR created automatically by Jules') ||
        contains(github.event.pull_request.body, 'jules.google.com')))
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Mark as ready for review (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.number }}"
          STATE=$(gh pr view "$PR" --json isDraft -q '.isDraft')
          if [ "$STATE" = "true" ]; then
            echo "Marking PR #$PR as ready for review..."
            gh pr ready "$PR"
          fi

      - name: Rebase branch onto main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.number }}"
          HEAD_REF=$(gh pr view "$PR" --json headRefName -q '.headRefName')
          BASE_REF=$(gh pr view "$PR" --json baseRefName -q '.baseRefName')

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin "$BASE_REF" "$HEAD_REF"
          git checkout -b pr-branch "origin/$HEAD_REF"

          if git rebase "origin/$BASE_REF"; then
            echo "Rebase succeeded. Pushing..."
            git push origin "pr-branch:$HEAD_REF" --force-with-lease
          else
            echo "Rebase has conflicts — skipping auto-merge for PR #$PR."
            git rebase --abort
            exit 1
          fi

      - name: Wait for status checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.number }}"
          echo "Watching status checks for PR #$PR..."
          # Give GitHub a few seconds to register the new rebased commit and start checks
          sleep 10
          gh pr checks "$PR" --watch --fail-fast

      - name: Merge PR with rebase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.number }}"
          echo "Merging PR #$PR with rebase..."
          gh pr merge "$PR" --rebase --delete-branch
